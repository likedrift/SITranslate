<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>思译</title>
  <link rel="stylesheet" href="/src/ui/style.css">
</head>
<body class="popup">
<main>
  <header class="brand">
    <span class="brand-mark" aria-hidden="true">译</span>
    <h1>思译</h1>
    <button class="icon-button" id="settings" type="button" title="打开设置" aria-label="打开设置">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"></path>
      </svg>
    </button>
  </header>

  <section class="primary-block">
    <div class="popup-fields">
      <label>翻译为<select id="target"></select></label>
      <label>使用模型<select id="profile"></select></label>
    </div>
    <fieldset class="segmented">
      <legend class="sr-only">显示方式</legend>
      <label><input type="radio" name="display" value="replace" checked><span>译文</span></label>
      <label><input type="radio" name="display" value="bilingual"><span>双语对照</span></label>
    </fieldset>
    <button class="primary translate-button" id="translate" type="button">翻译此页</button>
    <section class="progress-card" aria-live="polite">
      <div class="progress-heading"><span id="state">准备翻译</span><span id="count"></span></div>
      <progress id="progress" value="0" max="1" aria-label="页面翻译进度"></progress>
      <p id="detail" hidden></p>
    </section>
    <div class="row actions">
      <button class="secondary" id="stop" type="button" disabled>停止</button>
      <button class="secondary" id="restore" type="button">恢复原文</button>
      <button class="text-button" id="retry" type="button" hidden>重试失败部分</button>
    </div>
    <p class="notice" id="error" role="alert" hidden></p>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>实时语音</h2>
      <button class="text-button compact" id="speech-settings" type="button">语音设置</button>
    </div>
    <p id="speech-state" class="status" aria-live="polite">未开始</p>
    <p id="speech-timing" class="status" hidden></p>
    <p id="speech-usage" class="status" hidden></p>
    <p id="speech-stream-warning" class="notice" role="status" hidden></p>
    <div class="row">
      <button class="secondary" id="speech-start" type="button">开始实时翻译</button>
      <button class="text-button" id="speech-stop" type="button" disabled>停止音频</button>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>视频字幕</h2></div>
    <p id="video-state" class="status" aria-live="polite">正在读取字幕状态…</p>
    <div class="row">
      <button class="secondary" id="video-start" type="button" disabled>正在读取字幕状态…</button>
      <button class="text-button" id="video-stop" type="button" disabled>停止</button>
      <button class="text-button" id="video-retry" type="button" hidden>重试</button>
    </div>
    <label class="switch-row">
      <span class="switch-text">同时显示原文</span>
      <span class="switch">
        <input id="video-bilingual" type="checkbox" role="switch" checked>
        <span class="switch-ui" aria-hidden="true"></span>
      </span>
    </label>
  </section>

  <details class="fold">
    <summary>字幕位置与显示</summary>
    <p class="status">拖动字幕移动，四角缩放。宽度会清除手动尺寸。</p>
    <label>实时字幕节奏
      <select id="caption-reading">
        <option value="balanced">阅读优先</option>
        <option value="live">实时优先</option>
      </select>
    </label>
    <p class="status" id="caption-pause-note"></p>
    <label>字幕范围
      <select id="caption-mode">
        <option value="video">视频内</option>
        <option value="screen">整个页面</option>
      </select>
    </label>
    <label>字号 <output id="caption-font-label"></output><input type="range" id="caption-font" min="14" max="40"></label>
    <label>宽度 <output id="caption-width-label"></output><input type="range" id="caption-width" min="35" max="95"></label>
    <label>背景不透明度 <output id="caption-opacity-label"></output><input type="range" id="caption-opacity" min="10" max="100"></label>
    <label class="switch-row">
      <span class="switch-text">锁定位置和尺寸</span>
      <span class="switch">
        <input id="caption-lock" type="checkbox" role="switch">
        <span class="switch-ui" aria-hidden="true"></span>
      </span>
    </label>
    <button class="text-button" id="caption-reset" type="button">恢复默认位置与显示</button>
  </details>

  <details id="speech-diagnostics" class="fold">
    <summary>本地延迟诊断</summary>
    <pre id="speech-diagnostics-text" class="diagnostics-text">等待样本。</pre>
    <div class="row">
      <button id="speech-diagnostics-export" class="text-button" type="button">导出诊断</button>
      <button id="speech-diagnostics-clear" class="text-button" type="button">清除记录</button>
    </div>
  </details>

  <details class="fold">
    <summary>划词</summary>
    <p class="status">选中文字后，再点页面上的「译」。</p>
    <button class="text-button" id="grant-site" type="button" disabled>正在读取划词状态…</button>
  </details>

  <footer><span>点击后才发送文字</span><kbd>Alt ⇧ T</kbd></footer>
</main>
<script type="module" src="/src/ui/popup.ts"></script>
</body>
</html>
